; Flux Arcade Cabinet — PlatformIO build.
;
;   pio run -t upload          build and flash
;   pio device monitor         serial log, 115200
;
; JetConfig.hpp (Jet's per-frontend render config) lives in include/.
; PlatformIO's library dependency finder does NOT put the project's
; include/ on a lib_deps library's own include path (only -I below does),
; so Jet's headers — pulled in via lib_deps and expecting
; #include "JetConfig.hpp" to resolve to the frontend's copy — need it
; forced explicitly. See Jet's own README, "Getting started".
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Decodes a crash backtrace into file:line instead of raw addresses. Without
; it a Guru Meditation is just a list of hex, which is indistinguishable from
; a clean exit once the board has rebooted back to the launcher.
monitor_filters = esp32_exception_decoder

; The cabinet's ESP32-S3 talks to the host over native USB, so auto-reset
; and the default upload speed both work — no upload_speed/before_reset
; overrides needed. ARDUINO_USB_CDC_ON_BOOT=1 is set explicitly below so
; Serial output (including the boot log) isn't silently lost.
;
; build_unflags strips the -std=gnu++11 the espressif32 platform appends
; after build_flags (it otherwise wins over -std=gnu++17 below) — Jet's
; own code needs C++14 aggregate rules at minimum (its structs use default
; member initializers) and is written against C++17.
build_unflags =
  -std=gnu++11
build_flags =
  -std=gnu++17
  -Iinclude
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DBOARD_HAS_PSRAM

; Cabinet + game code alone is well under the default 1.31 MB app
; partition, but Jet's rasteriser and the SD-backed audio/WAV paths add
; enough that huge_app.csv (3 MB app, no OTA) is worth having headroom in
; rather than tuning the partition table later. OTA is not a goal here.
; huge_app.csv is sized for a 4MB flash chip (see flash_size below).
board_build.partitions = huge_app.csv

; The stock esp32-s3-devkitc-1 board definition assumes an 8MB-flash N8
; part. Confirmed on hardware: this cabinet's board reports 4MB physical
; flash at boot ("Detected size(4096k)") — without this override the ROM
; bootloader rejects the 8MB image header and the board loops on
; "assert failed: do_core_init ... flash_ret == ESP_OK" instead of booting.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304

; Confirmed via `esptool.py flash_id` on the actual board: ESP32-S3FH4R2 —
; 4MB flash, 2MB embedded PSRAM, both quad SPI (not the octal-PSRAM N16R8
; variant, which would need qio_opi instead). This line is what actually
; initialises PSRAM at boot (ESP.getPsramSize() read 0 before it was set).
; -DBOARD_HAS_PSRAM above is only a documentation marker — nothing in Jet
; or this project's own code reads it yet.
;
; Enabling PSRAM doesn't change today's behaviour: the game currently fits
; in internal SRAM alone, confirmed by a full session's heap logging that
; held flat at ~7KB largest free block with PSRAM disabled entirely. This
; adds a ~2MB spillover for whatever grows the render queue past internal
; SRAM next (new enemy types, arena events, a bigger ground mesh).
; ESP-IDF's allocator prefers internal RAM and only spills to PSRAM once
; it's exhausted, so this shouldn't move any of Jet's per-frame rasteriser
; traffic onto PSRAM's slower bus unless SRAM genuinely runs out again —
; worth confirming with the same heap logging approach if a future feature
; reopens that ceiling.
board_build.arduino.memory_type = qio_qspi

lib_deps =
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
  adafruit/Adafruit BusIO@^1.16.1
  https://github.com/CubeCoders/Jet.git

; If your board is instead a larger-flash/PSRAM SuperMini variant (e.g. a
; 16MB/8MB N16R8, octal rather than quad PSRAM), use this instead:
; board_upload.flash_size = 16MB
; board_upload.maximum_size = 16777216
; board_build.arduino.memory_type = qio_opi
; Check your actual chip with `esptool.py flash_id` if unsure.
